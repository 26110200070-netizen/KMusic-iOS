name: Build K.Music iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          swift --version

      - name: Build Archive (Unsigned)
        run: |
          set -o pipefail
          xcodebuild -project KMusic.xcodeproj \
            -scheme KMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KMusic.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA for ESign
        run: |
          mkdir -p Payload
          cp -r build/KMusic.xcarchive/Products/Applications/KMusic.app Payload/
          zip -r -y kmusic_unsigned.ipa Payload
          ls -lh kmusic_unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmusic_unsigned_ipa
          path: kmusic_unsigned.ipa
          retention-days: 30

      - name: Create GitHub Release with direct IPA download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "K.Music iOS v1.0.0 (Unsigned IPA)"
          body: |
            ### 🎵 K.Music iOS v1.0.0 - Ứng dụng Nghe Nhạc Chuẩn Apple Liquid Glass
            Phát triển bởi **Khoa Dev**.

            #### ✨ Các tính năng nổi bật:
            1. 🪟 **Liquid Glass TabBar chuẩn Apple**:
               - Thanh TabBar hiệu ứng Liquid Glass lơ lửng mềm mại với 4 tab: **KhoaHome**, **Tìm kiếm**, **Thư viện**, **Album**.
               - Tab Indicator hiệu ứng viên thuốc capsule chuyển động mượt mà.
            2. 🎵 **MiniPlayer & Full Player Đẳng Cấp**:
               - MiniPlayer lơ lửng dạng kính phía trên tabbar, điều khiển nhanh Play/Pause/Next.
               - Full Player vuốt mở toàn màn hình với nền làm mờ động theo bìa nhạc, thanh trượt thời gian tương tác mượt mà.
            3. 📜 **Lời bài hát đồng bộ thời gian thực (Synced Lyrics)**:
               - Kết nối trực tiếp LrcLib API tự động đồng bộ lời chạy theo tiến trình bài hát.
            4. 🔍 **Tìm kiếm & Gợi ý nhạc thông minh**:
               - Gợi ý từ khóa tức thì khi gõ.
               - Lọc kết quả chuyên nghiệp: **Top Kết Quả**, **Nghệ Sĩ**, **Album**, **Bài Hát**, **Playlist**.
            5. 🏠 **Trang chủ (KhoaHome) Designer Chuẩn Mực**:
               - Băng rôn đỏ rực rỡ phong cách Apple Music: "Âm nhạc chỉ dành cho bạn. Miễn phí 1 tháng."
               - Nhạc trang chủ để thoáng đãng bên ngoài, không lồng khung hộp thô kệch.
               - Hàng nghệ sĩ nổi bật, album mới tuyển chọn, bảng xếp hạng Top 100 Việt Nam.
            6. 🎧 **Hỗ trợ phát nền & Màn hình khóa (Lockscreen NowPlaying)**:
               - Tích hợp `AVAudioSession`, `MPNowPlayingInfoCenter`, và `MPRemoteCommandCenter`.

            #### 📱 Hướng dẫn cài đặt qua ESign:
            1. Tải file `kmusic_unsigned.ipa` đính kèm bên dưới về iPhone.
            2. Mở ứng dụng **ESign** trên máy.
            3. Chọn file `kmusic_unsigned.ipa`, chọn chứng chỉ cá nhân của bạn và nhấn **Ký & Cài đặt (Sign & Install)**.
          files: kmusic_unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
